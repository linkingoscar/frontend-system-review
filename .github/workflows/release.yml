name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify tag and version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat skills/frontend-system-review/VERSION)"
          python tools/verify_release.py
          python skills/frontend-system-review/scripts/check_standards_freshness.py
          FRONTEND_REVIEW_NODE_MODULES="$GITHUB_WORKSPACE/node_modules" python -m unittest evals.test_tooling -v
      - name: Build release assets
        run: python tools/package_release.py --output dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="release/notes-${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$notes" --title "Frontend System Review $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Frontend System Review $GITHUB_REF_NAME"
          fi
