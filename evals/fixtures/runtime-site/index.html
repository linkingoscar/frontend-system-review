<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Runtime fixture</title>
    <style>.wide { width: 1200px; } .muted { color: #aaa; background: #fff; } transition-demo { transition: all 1s; }</style>
  </head>
  <body>
    <main class="wide">
      <h1>Runtime fixture</h1>
      <p class="muted">Low contrast fixture text</p>
      <label>Search <input id="search" placeholder="Search"></label>
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">
      <button></button>
      <button id="search-button">Search</button>
      <p id="search-result" role="status" aria-live="polite"></p>
    </main>
    <script src="/missing.js"></script>
    <script>
      console.error("fixture console error");
      document.querySelector("#search-button").addEventListener("click", () => {
        const query = document.querySelector("#search").value;
        document.querySelector("#search-result").textContent = query ? `Result for ${query}` : "Enter a query";
      });
    </script>
  </body>
</html>
